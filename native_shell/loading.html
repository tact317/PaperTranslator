<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PeperTranslator</title>
  <style>
    html,body{height:100%;margin:0;background:#09090b;color:#e4e4e7;font-family:"Segoe UI",sans-serif}
    body{display:grid;place-items:center}
    .box{text-align:center}.mark{width:48px;height:48px;border-radius:14px;margin:0 auto 18px;background:#18181b;border:1px solid #27272a;display:grid;place-items:center;font-weight:700;color:#818cf8}
    h1{font-size:19px;margin:0 0 8px;font-weight:600;letter-spacing:.02em}p{font-size:12px;color:#71717a;margin:0}
    .bar{width:180px;height:2px;background:#18181b;margin:22px auto 0;overflow:hidden;border-radius:99px}.bar:after{content:"";display:block;width:45%;height:100%;background:#6366f1;animation:m 1.2s ease-in-out infinite}@keyframes m{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
  </style>
</head>
<body><div class="box"><div class="mark">P</div><h1>PeperTranslator</h1><p>ローカルサービスを起動しています...</p><div class="bar"></div></div></body>
</html>
